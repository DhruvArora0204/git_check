[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securecommit"
version = "0.1.0"
description = "AI-Powered, IDE-Independent Code Vulnerability Detection & Remediation Tool"
readme = "README.md"
authors = [{ name = "SecureCommit Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "semgrep>=1.0.0",
]

[project.scripts]
securecommit = "securecommit.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["securecommit*"]
