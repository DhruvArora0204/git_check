rules:
  - id: python-sql-injection-concatenation
    patterns:
      - pattern-either:
          - pattern: |
              $QUERY = "..." + ...
              ...
              $CURSOR.execute($QUERY, ...)
          - pattern: |
              $QUERY = "..." % ...
              ...
              $CURSOR.execute($QUERY, ...)
          - pattern: |
              $QUERY = f"..."
              ...
              $CURSOR.execute($QUERY, ...)
          - pattern: $CURSOR.execute("..." % ...)
          - pattern: $CURSOR.execute("..." + ...)
          - pattern: $CURSOR.execute(f"...")
          - pattern: $CURSOR.execute($QUERY + ...)
          - pattern: $CURSOR.execute($QUERY % ...)
          - pattern: $CURSOR.execute(f"{$X}...")
    message: "Potential SQL Injection detected: dynamic SQL query constructed via string concatenation or formatting. Use parameterized queries instead."
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      category: "security"
      technology:
        - python
        - sql
    severity: ERROR
    languages: [python]

  - id: python-command-injection-os-system
    patterns:
      - pattern-either:
          - pattern: os.system($CMD + ...)
          - pattern: os.system(f"...")
          - pattern: subprocess.Popen($CMD + ..., shell=True, ...)
          - pattern: subprocess.run($CMD + ..., shell=True, ...)
          - pattern: subprocess.call($CMD + ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD + ..., shell=True, ...)
    message: "Potential Command Injection detected: executing shell commands with unescaped or concatenated user input."
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: "A03:2021 - Injection"
      category: "security"
      technology:
        - python
    severity: ERROR
    languages: [python]

  - id: python-cross-site-scripting-markupsafe
    patterns:
      - pattern-either:
          - pattern: markupsafe.Markup($X + ...)
          - pattern: flask.render_template_string("..." + ...)
          - pattern: flask.render_template_string(f"...")
    message: "Potential Cross-Site Scripting (XSS) detected: unescaped user input rendered directly as HTML/markup."
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      category: "security"
      technology:
        - python
        - flask
    severity: WARNING
    languages: [python]

  - id: python-insecure-deserialization-pickle
    patterns:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: _pickle.loads(...)
          - pattern: yaml.load($DATA, Loader=yaml.Loader)
    message: "Insecure Deserialization detected: loading untrusted serialized data can lead to arbitrary remote code execution."
    metadata:
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 - Software and Data Integrity Failures"
      category: "security"
      technology:
        - python
    severity: ERROR
    languages: [python]

  - id: python-weak-cryptography-md5-sha1
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
    message: "Weak Cryptographic Hash detected: MD5 and SHA-1 are cryptographically broken and prone to collision attacks. Use SHA-256 or stronger."
    metadata:
      cwe: "CWE-328: Use of Weak Hash"
      owasp: "A02:2021 - Cryptographic Failures"
      category: "security"
      technology:
        - python
    severity: WARNING
    languages: [python]

  - id: python-insecure-eval
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
    message: "Use of eval() or exec() detected: executing arbitrary code strings is extremely dangerous and often leads to Remote Code Execution."
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      owasp: "A03:2021 - Injection"
      category: "security"
      technology:
        - python
    severity: ERROR
    languages: [python]
